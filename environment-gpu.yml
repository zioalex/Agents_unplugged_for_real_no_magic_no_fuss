name: agents_unplugged
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # GPU-specific: CUDA 12.1 toolkit and PyTorch with CUDA support
  - pytorch::pytorch>=2.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=12.1
  - nvidia::cuda-toolkit=12.1

  # Core scientific computing
  - numpy>=1.26.2
  - pandas>=2.0
  - scipy>=1.14.1

  # Visualization
  - matplotlib>=3.7
  - pillow>=10.0

  # Jupyter support
  - jupyter
  - ipykernel
  - notebook

  # Build tools (needed for some pip packages)
  - gcc_linux-64
  - gxx_linux-64

  # Additional conda packages
  - requests>=2.31

  # Everything else via pip
  - pip
  - pip:
      # LangChain ecosystem
      - langchain>=0.2
      - langchain-openai>=0.1
      - langchain-community>=0.2
      - langchain-ollama>=0.1
      - langchain-mcp-adapters>=0.1

      # LangFlow
      - langflow>=1.1

      # MCP
      - "mcp[cli]>=0.1"

      # vLLM - GPU version with CUDA 12.1 support
      - vllm==0.6.5

      # Additional utilities
      - python-dotenv
