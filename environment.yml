name: agents_unplugged
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # CUDA toolkit (will be auto-selected based on GPU availability)
  # For GPU: pytorch-cuda will be installed
  # For CPU: CPU-only pytorch will be installed
  - pytorch::pytorch>=2.0
  - pytorch::torchvision
  - pytorch::torchaudio

  # Core scientific computing
  - numpy>=1.26.2
  - pandas>=2.0
  - scipy>=1.14.1

  # Visualization
  - matplotlib>=3.7
  - pillow>=10.0

  # Jupyter support
  - jupyter
  - ipykernel
  - notebook

  # Build tools (needed for some pip packages)
  - gcc_linux-64
  - gxx_linux-64

  # Additional conda packages that work better from conda
  - requests>=2.31

  # Everything else via pip (keeps environment.yml cleaner)
  - pip
  - pip:
      # LangChain ecosystem
      - langchain>=0.2
      - langchain-openai>=0.1
      - langchain-community>=0.2
      - langchain-ollama>=0.1
      - langchain-mcp-adapters>=0.1

      # LangFlow (heavy dependency)
      - langflow>=1.1

      # MCP
      - "mcp[cli]>=0.1"

      # vLLM - version locked for stability
      # Note: Requires CUDA 11.8 or 12.1
      # The conda pytorch-cuda version will be compatible
      - vllm==0.6.5

      # Additional utilities
      - python-dotenv
