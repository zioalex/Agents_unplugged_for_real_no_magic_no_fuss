# Minimal Conda Environment for GPU
# This installs ONLY system-level dependencies via conda
# Python packages are installed via pip afterwards (much faster!)

name: agents_unplugged-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # GPU: CUDA toolkit and PyTorch with CUDA support
  - pytorch=2.5.*
  - torchvision=0.20.*
  - torchaudio=2.5.*
  - pytorch-cuda=12.1
  - cuda-toolkit=12.1

  # # Jupyter
  # - jupyter
  # - ipykernel
  # - notebook

  # Pip (to install remaining packages)
  - pip

  # Note: All other packages will be installed via pip
  # This keeps conda resolution fast and prevents memory issues
