name: agents_unplugged
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # CPU-only PyTorch (much smaller download)
  - pytorch::pytorch>=2.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - cpuonly

  # Core scientific computing
  - numpy>=1.26.2
  - pandas>=2.0
  - scipy>=1.14.1

  # Visualization
  - matplotlib>=3.7
  - pillow>=10.0

  # Jupyter support
  - jupyter
  - ipykernel
  - notebook

  # Build tools
  - gcc_linux-64
  - gxx_linux-64

  # Additional conda packages
  - requests>=2.31

  # Everything else via pip
  - pip
  - pip:
      # LangChain ecosystem
      - langchain>=0.2
      - langchain-openai>=0.1
      - langchain-community>=0.2
      - langchain-ollama>=0.1
      - langchain-mcp-adapters>=0.1

      # LangFlow
      - langflow>=1.1

      # MCP
      - "mcp[cli]>=0.1"

      # Note: vLLM requires GPU, not installing for CPU-only environment
      # If you need vLLM, use environment-gpu.yml instead

      # Additional utilities
      - python-dotenv
